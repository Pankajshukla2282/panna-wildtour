name: Build Theme Package

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package panna-wildtour
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP files
        run: |
          if find . -name '*.php' -print0 | xargs -0 -r php -l | grep -v 'No syntax errors'; then
            echo "::error::PHP syntax errors detected"
            exit 1
          fi

      - name: Validate child theme structure
        run: |
          test -f style.css
          test -f index.php
          test -f functions.php
          grep -qi '^Theme Name:' style.css
          grep -qi '^Template: wildtours-base-theme' style.css

      - name: Build installable zip
        shell: bash
        run: |
          set -euo pipefail
          SLUG="panna-wildtour"
          VERSION="$(grep -iE 'Version:' style.css | head -n1 | sed -E 's/.*Version:[[:space:]]*([0-9][^[:space:];]*).*/\1/')"
          VERSION="${VERSION:-dev}"
          STAGING="${RUNNER_TEMP}/${SLUG}"
          mkdir -p "${STAGING}"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='README.md' \
            --exclude='*.zip' \
            --exclude='*.bak' \
            --exclude='*.log' \
            --exclude='node_modules/' \
            --exclude='build/' \
            --exclude='vendor/' \
            ./ "${STAGING}/"
          ( cd "${RUNNER_TEMP}" && zip -qr "${SLUG}-${VERSION}.zip" "${SLUG}" )
          echo "ZIP_PATH=${RUNNER_TEMP}/${SLUG}-${VERSION}.zip" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Verify zip structure
        run: |
          unzip -l "${ZIP_PATH}" | grep -q "${SLUG}/style.css"
          unzip -l "${ZIP_PATH}" | grep -q "${SLUG}/index.php"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panna-wildtour-${{ env.PACKAGE_VERSION }}
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${ZIP_PATH}" \
            --title "panna-wildtour ${GITHUB_REF_NAME}" \
            --generate-notes || true
